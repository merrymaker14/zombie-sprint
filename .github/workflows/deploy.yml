name: Deploy Zombie Sprint to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # This Pages site is the URL VK opens in its iframe and WebView, so the
      # VK build goes here — not the neutral one. VK keeps its own loader over
      # the frame until the app sends VKWebAppInit, and that call lives in
      # libs/vkok-boot.js, which only the vkok target ships. Publishing plain
      # `dist` left the bridge out entirely: the game ran fine on its own URL
      # while VK moderation saw a spinner and rejected it as "does not start".
      - run: node tools/build-targets.mjs --target=vkok
      - name: VK bridge is really in the artifact
        run: |
          test -f dist-vkok/libs/vk-bridge.min.js
          test -f dist-vkok/libs/vkok-boot.js
          grep -q 'libs/vk-bridge.min.js' dist-vkok/index.html
          grep -q 'libs/vkok-boot.js' dist-vkok/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-vkok

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
